<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone cassé / réparé</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #30384a 0%, #111827 55%, #05070d 100%);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .scene {
      width: 310px;
      height: 610px;
      perspective: 1200px;
      cursor: pointer;
      position: relative;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: -70px;
      transform: translateX(-50%);
      width: 360px;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      letter-spacing: 0.3px;
    }

    .phone-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.2,.8,.2,1);
    }

    .scene:hover .phone-wrapper:not(.repaired) {
      animation: shake 0.28s infinite;
    }

    .phone-wrapper.repaired {
      transform: rotateY(180deg);
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-1deg); }
      40% { transform: translate(4px, -2px) rotate(1deg); }
      60% { transform: translate(-3px, -1px) rotate(0.7deg); }
      80% { transform: translate(3px, 2px) rotate(-0.7deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .phone {
      position: absolute;
      inset: 0;
      border-radius: 46px;
      background: #090b10;
      border: 9px solid #1f2937;
      box-shadow:
        0 35px 80px rgba(0,0,0,0.55),
        inset 0 0 0 3px rgba(255,255,255,0.04);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 27px;
      background: #05070a;
      border-radius: 999px;
      z-index: 5;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.05);
    }

    .screen {
      position: absolute;
      inset: 10px;
      border-radius: 34px;
      overflow: hidden;
      background: linear-gradient(145deg, #0f172a, #111827 45%, #020617);
    }

    .broken .screen {
      background:
        radial-gradient(circle at 30% 35%, rgba(255,255,255,0.16), transparent 14%),
        linear-gradient(145deg, #111827, #020617 65%, #000);
    }

    .fixed {
      transform: rotateY(180deg);
    }

    .fixed .screen {
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,0.35), transparent 16%),
        linear-gradient(145deg, #38bdf8, #6366f1 45%, #a855f7 100%);
    }

    .wallpaper-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.75;
    }

    .fixed .wallpaper-circle:nth-child(1) {
      width: 180px;
      height: 180px;
      left: -45px;
      top: 85px;
      background: rgba(255,255,255,0.24);
    }

    .fixed .wallpaper-circle:nth-child(2) {
      width: 220px;
      height: 220px;
      right: -85px;
      bottom: 80px;
      background: rgba(236,72,153,0.45);
    }

    .fixed .wallpaper-circle:nth-child(3) {
      width: 120px;
      height: 120px;
      right: 35px;
      top: 180px;
      background: rgba(34,211,238,0.45);
    }

    .status {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 17px;
      z-index: 6;
    }

    .time {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 56px;
      font-weight: 200;
      z-index: 4;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .subtitle {
      position: absolute;
      top: 168px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 16px;
      opacity: 0.85;
      z-index: 4;
    }

    .app-grid {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 44px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      z-index: 4;
    }

    .app {
      aspect-ratio: 1;
      border-radius: 15px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 8px 20px rgba(0,0,0,0.16);
    }

    .app:nth-child(1) { background: linear-gradient(135deg, #22c55e, #86efac); }
    .app:nth-child(2) { background: linear-gradient(135deg, #3b82f6, #93c5fd); }
    .app:nth-child(3) { background: linear-gradient(135deg, #f97316, #fdba74); }
    .app:nth-child(4) { background: linear-gradient(135deg, #ec4899, #f9a8d4); }
    .app:nth-child(5) { background: linear-gradient(135deg, #8b5cf6, #c4b5fd); }
    .app:nth-child(6) { background: linear-gradient(135deg, #14b8a6, #99f6e4); }
    .app:nth-child(7) { background: linear-gradient(135deg, #eab308, #fde68a); }
    .app:nth-child(8) { background: linear-gradient(135deg, #64748b, #cbd5e1); }

    .crack {
      position: absolute;
      height: 3px;
      background: rgba(238, 242, 255, 0.9);
      transform-origin: left center;
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      z-index: 4;
    }

    .crack::after {
      content: "";
      position: absolute;
      right: -4px;
      top: -3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
    }

    .c1 { width: 130px; left: 82px; top: 170px; transform: rotate(35deg); }
    .c2 { width: 90px; left: 160px; top: 248px; transform: rotate(-42deg); }
    .c3 { width: 110px; left: 64px; top: 300px; transform: rotate(-25deg); }
    .c4 { width: 86px; left: 120px; top: 372px; transform: rotate(48deg); }
    .c5 { width: 58px; left: 158px; top: 168px; transform: rotate(-78deg); }
    .c6 { width: 70px; left: 80px; top: 236px; transform: rotate(76deg); }
    .c7 { width: 55px; left: 184px; top: 337px; transform: rotate(14deg); }

    .impact {
      position: absolute;
      width: 54px;
      height: 54px;
      left: 144px;
      top: 216px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.75);
      box-shadow: 0 0 18px rgba(255,255,255,0.35);
      z-index: 4;
    }

    .impact::before,
    .impact::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 90px;
      height: 2px;
      background: rgba(255,255,255,0.65);
      transform-origin: left center;
    }

    .impact::before {
      transform: rotate(22deg);
    }

    .impact::after {
      transform: rotate(112deg);
    }

    .glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.18) 35%, transparent 55%);
      transform: translateX(-40%);
      z-index: 3;
      pointer-events: none;
    }

    .repair-flash {
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle, rgba(255,255,255,0.85), transparent 62%);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .scene.flash .repair-flash {
      animation: flash 0.65s ease-out;
    }

    @keyframes flash {
      0% { opacity: 0; transform: scale(0.7); }
      35% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Téléphone cassé interactif">
    <div class="repair-flash"></div>

    <div class="phone-wrapper" id="phoneWrapper">
      <section class="phone broken" aria-label="Téléphone cassé">
        <div class="screen">
          <div class="glare"></div>
          <div class="status">Écran cassé</div>
          <div class="time">13:37</div>
          <div class="subtitle">Passe la souris puis clique</div>

          <span class="impact"></span>
          <span class="crack c1"></span>
          <span class="crack c2"></span>
          <span class="crack c3"></span>
          <span class="crack c4"></span>
          <span class="crack c5"></span>
          <span class="crack c6"></span>
          <span class="crack c7"></span>
        </div>
      </section>

      <section class="phone fixed" aria-label="Téléphone réparé">
        <div class="screen">
          <div class="wallpaper-circle"></div>
          <div class="wallpaper-circle"></div>
          <div class="wallpaper-circle"></div>
          <div class="glare"></div>
          <div class="status">Réparé ✓</div>
          <div class="time">13:38</div>
          <div class="subtitle">Écran comme neuf</div>

          <div class="app-grid">
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
          </div>
        </div>
      </section>
    </div>

    <p class="hint" id="hint">Survole le téléphone pour le faire trembler, puis clique pour le réparer.</p>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const phoneWrapper = document.getElementById('phoneWrapper');
    const hint = document.getElementById('hint');

    scene.addEventListener('click', () => {
      phoneWrapper.classList.toggle('repaired');
      scene.classList.remove('flash');
      void scene.offsetWidth;
      scene.classList.add('flash');

      const isRepaired = phoneWrapper.classList.contains('repaired');
      hint.textContent = isRepaired
        ? 'Clique à nouveau pour revoir la version cassée.'
        : 'Survole le téléphone pour le faire trembler, puis clique pour le réparer.';
    });
  </script>
</body>
</html>
