<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone cassé / réparé</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #30384a 0%, #111827 55%, #05070d 100%);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .scene {
      width: 310px;
      height: 610px;
      perspective: 1200px;
      cursor: pointer;
      position: relative;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: -70px;
      transform: translateX(-50%);
      width: 360px;
      text-align: center;
      font-size: 15px;
      opacity: 0.8;
      letter-spacing: 0.3px;
    }

    .phone-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.2,.8,.2,1);
    }

    .scene:hover .phone-wrapper:not(.repaired) {
      animation: shake 0.28s infinite;
    }

    .phone-wrapper.repaired {
      transform: rotateY(180deg);
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-1deg); }
      40% { transform: translate(4px, -2px) rotate(1deg); }
      60% { transform: translate(-3px, -1px) rotate(0.7deg); }
      80% { transform: translate(3px, 2px) rotate(-0.7deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .phone {
      position: absolute;
      inset: 0;
      border-radius: 46px;
      background: #090b10;
      border: 9px solid #1f2937;
      box-shadow:
        0 35px 80px rgba(0,0,0,0.55),
        inset 0 0 0 3px rgba(255,255,255,0.04);
      backface-visibility: hidden;
      overflow: hidden;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 27px;
      background: #05070a;
      border-radius: 999px;
      z-index: 8;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.05);
    }

    .screen {
      position: absolute;
      inset: 10px;
      border-radius: 34px;
      overflow: hidden;
      background: linear-gradient(145deg, #0f172a, #111827 45%, #020617);
    }

    .broken .screen {
      background:
        radial-gradient(circle at 52% 39%, rgba(255,255,255,0.22), transparent 7%),
        radial-gradient(circle at 22% 18%, rgba(255,255,255,0.12), transparent 16%),
        linear-gradient(145deg, #111827, #020617 65%, #000);
    }

    .fixed {
      transform: rotateY(180deg);
    }

    .fixed .screen {
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,0.35), transparent 16%),
        linear-gradient(145deg, #38bdf8, #6366f1 45%, #a855f7 100%);
    }

    .wallpaper-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.75;
    }

    .fixed .wallpaper-circle:nth-child(1) {
      width: 180px;
      height: 180px;
      left: -45px;
      top: 85px;
      background: rgba(255,255,255,0.24);
    }

    .fixed .wallpaper-circle:nth-child(2) {
      width: 220px;
      height: 220px;
      right: -85px;
      bottom: 80px;
      background: rgba(236,72,153,0.45);
    }

    .fixed .wallpaper-circle:nth-child(3) {
      width: 120px;
      height: 120px;
      right: 35px;
      top: 180px;
      background: rgba(34,211,238,0.45);
    }

    .status {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 17px;
      z-index: 6;
    }

    .time {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 56px;
      font-weight: 200;
      z-index: 4;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .subtitle {
      position: absolute;
      top: 168px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 16px;
      opacity: 0.85;
      z-index: 4;
    }

    .app-grid {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 44px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      z-index: 4;
    }

    .app {
      aspect-ratio: 1;
      border-radius: 15px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 8px 20px rgba(0,0,0,0.16);
    }

    .app:nth-child(1) { background: linear-gradient(135deg, #22c55e, #86efac); }
    .app:nth-child(2) { background: linear-gradient(135deg, #3b82f6, #93c5fd); }
    .app:nth-child(3) { background: linear-gradient(135deg, #f97316, #fdba74); }
    .app:nth-child(4) { background: linear-gradient(135deg, #ec4899, #f9a8d4); }
    .app:nth-child(5) { background: linear-gradient(135deg, #8b5cf6, #c4b5fd); }
    .app:nth-child(6) { background: linear-gradient(135deg, #14b8a6, #99f6e4); }
    .app:nth-child(7) { background: linear-gradient(135deg, #eab308, #fde68a); }
    .app:nth-child(8) { background: linear-gradient(135deg, #64748b, #cbd5e1); }

    .broken-glass {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .glass-haze {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 55% 39%, rgba(255,255,255,0.44) 0 3%, rgba(255,255,255,0.14) 4% 13%, transparent 22%),
        radial-gradient(circle at 28% 64%, rgba(255,255,255,0.14), transparent 18%),
        radial-gradient(circle at 75% 72%, rgba(255,255,255,0.12), transparent 14%),
        linear-gradient(120deg, transparent 0 18%, rgba(255,255,255,0.08) 20%, transparent 34% 100%);
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .shard {
      position: absolute;
      background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.32);
      clip-path: polygon(var(--shape));
      box-shadow: inset 0 0 18px rgba(255,255,255,0.08);
      backdrop-filter: blur(1px);
    }

    .s1 { --shape: 0 0, 100% 14%, 70% 100%, 16% 72%; width: 88px; height: 96px; left: 102px; top: 172px; }
    .s2 { --shape: 15% 0, 100% 32%, 78% 100%, 0 70%; width: 106px; height: 112px; left: 168px; top: 185px; }
    .s3 { --shape: 0 22%, 72% 0, 100% 90%, 16% 100%; width: 96px; height: 126px; left: 58px; top: 242px; }
    .s4 { --shape: 18% 0, 100% 12%, 78% 74%, 0 100%; width: 128px; height: 112px; left: 118px; top: 302px; }
    .s5 { --shape: 0 0, 100% 18%, 86% 100%, 24% 70%; width: 82px; height: 140px; left: 184px; top: 332px; }
    .s6 { --shape: 22% 0, 100% 58%, 52% 100%, 0 38%; width: 74px; height: 82px; left: 38px; top: 390px; }
    .s7 { --shape: 0 28%, 86% 0, 100% 100%, 24% 82%; width: 108px; height: 78px; left: 76px; top: 468px; }
    .s8 { --shape: 12% 0, 100% 0, 80% 100%, 0 72%; width: 84px; height: 72px; left: 185px; top: 486px; }

    svg.crack-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 3px rgba(255,255,255,0.65));
    }

    .crack-main {
      fill: none;
      stroke: rgba(255,255,255,0.92);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .crack-thin {
      fill: none;
      stroke: rgba(255,255,255,0.62);
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .crack-dark {
      fill: none;
      stroke: rgba(0,0,0,0.45);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(1px);
    }

    .impact {
      position: absolute;
      width: 74px;
      height: 74px;
      left: 128px;
      top: 204px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,0.75) 0 4px, rgba(255,255,255,0.22) 5px 16px, transparent 17px),
        repeating-radial-gradient(circle, rgba(255,255,255,0.32) 0 2px, transparent 3px 8px);
      border: 2px solid rgba(255,255,255,0.66);
      box-shadow:
        0 0 24px rgba(255,255,255,0.38),
        inset 0 0 18px rgba(255,255,255,0.18);
      z-index: 6;
    }

    .glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.18) 35%, transparent 55%);
      transform: translateX(-40%);
      z-index: 3;
      pointer-events: none;
    }

    .repair-flash {
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle, rgba(255,255,255,0.85), transparent 62%);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .scene.flash .repair-flash {
      animation: flash 0.65s ease-out;
    }

    @keyframes flash {
      0% { opacity: 0; transform: scale(0.7); }
      35% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Téléphone cassé interactif">
    <div class="repair-flash"></div>

    <div class="phone-wrapper" id="phoneWrapper">
      <section class="phone broken" aria-label="Téléphone cassé">
        <div class="screen">
          <div class="glare"></div>
          <div class="status">Écran cassé</div>
          <div class="time">13:37</div>
          <div class="subtitle">Passe la souris puis clique</div>

          <div class="broken-glass" aria-hidden="true">
            <div class="glass-haze"></div>
            <span class="shard s1"></span>
            <span class="shard s2"></span>
            <span class="shard s3"></span>
            <span class="shard s4"></span>
            <span class="shard s5"></span>
            <span class="shard s6"></span>
            <span class="shard s7"></span>
            <span class="shard s8"></span>
            <span class="impact"></span>
            <svg class="crack-map" viewBox="0 0 292 592" preserveAspectRatio="none">
              <path class="crack-dark" d="M154 242 L132 196 L108 166 L92 124 L73 86" />
              <path class="crack-dark" d="M154 242 L198 206 L242 188 L275 155" />
              <path class="crack-dark" d="M154 242 L178 292 L215 345 L236 418 L262 505" />
              <path class="crack-dark" d="M154 242 L119 292 L78 332 L48 396 L22 474" />
              <path class="crack-dark" d="M154 242 L148 318 L158 390 L144 474 L151 566" />

              <path class="crack-main" d="M154 242 L132 196 L108 166 L92 124 L73 86" />
              <path class="crack-main" d="M154 242 L198 206 L242 188 L275 155" />
              <path class="crack-main" d="M154 242 L178 292 L215 345 L236 418 L262 505" />
              <path class="crack-main" d="M154 242 L119 292 L78 332 L48 396 L22 474" />
              <path class="crack-main" d="M154 242 L148 318 L158 390 L144 474 L151 566" />

              <path class="crack-thin" d="M132 196 L165 174 L190 136" />
              <path class="crack-thin" d="M108 166 L66 178 L28 168" />
              <path class="crack-thin" d="M198 206 L218 246 L257 278" />
              <path class="crack-thin" d="M242 188 L250 226 L288 242" />
              <path class="crack-thin" d="M178 292 L146 348 L109 378" />
              <path class="crack-thin" d="M215 345 L184 386 L184 442" />
              <path class="crack-thin" d="M236 418 L210 462 L218 535" />
              <path class="crack-thin" d="M119 292 L96 256 L56 239" />
              <path class="crack-thin" d="M78 332 L112 370 L122 425" />
              <path class="crack-thin" d="M48 396 L82 444 L72 528" />
              <path class="crack-thin" d="M148 318 L186 326 L228 306" />
              <path class="crack-thin" d="M158 390 L122 448 L98 514" />
            </svg>
          </div>
        </div>
      </section>

      <section class="phone fixed" aria-label="Téléphone réparé">
        <div class="screen">
          <div class="wallpaper-circle"></div>
          <div class="wallpaper-circle"></div>
          <div class="wallpaper-circle"></div>
          <div class="glare"></div>
          <div class="status">Réparé ✓</div>
          <div class="time">13:38</div>
          <div class="subtitle">Écran comme neuf</div>

          <div class="app-grid">
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
            <span class="app"></span>
          </div>
        </div>
      </section>
    </div>

    <p class="hint" id="hint">Survole le téléphone pour le faire trembler, puis clique pour le réparer.</p>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const phoneWrapper = document.getElementById('phoneWrapper');
    const hint = document.getElementById('hint');

    scene.addEventListener('click', () => {
      phoneWrapper.classList.toggle('repaired');
      scene.classList.remove('flash');
      void scene.offsetWidth;
      scene.classList.add('flash');

      const isRepaired = phoneWrapper.classList.contains('repaired');
      hint.textContent = isRepaired
        ? 'Clique à nouveau pour revoir la version cassée.'
        : 'Survole le téléphone pour le faire trembler, puis clique pour le réparer.';
    });
  </script>
</body>
</html>
